    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {

            background: linear-gradient(160deg, #FDF6FB 0%, #F5EFF7 30%, #FCE4EC 60%, #FFF0F5 100%);
            min-height: 100vh;
            padding: 30px 20px;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 20%, rgba(231, 134, 167, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(185, 131, 255, 0.1) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(255, 194, 220, 0.08) 0%, transparent 50%);

            z-index: 0;
        }
        .header {
            background: linear-gradient(135deg, #E786A7 0%, #B983FF 50%, #FFC2DC 100%);
            color: #fff;
            text-align: center;
            padding: 45px 25px;
            border-radius: 28px;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 45px rgba(185, 131, 255, 0.35);
            max-width: 950px;
            margin-left: auto;
            margin-right: auto;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.15);

        .header p {
            font-size: 0.95rem;

        }

            margin: 0 auto 15px;

            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #6B4C6E;
            text-align: center;
            z-index: 1;
            position: relative;
            font-weight: 500;
        }
        .notice strong {
            color: #B983FF;
        }
        .container {
            max-width: 950px;
            margin: 0 auto 25px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border-radius: 24px;
            position: relative;
            z-index: 1;
            box-shadow: 0 15px 40px rgba(180, 130, 180, 0.2);
            border: 1px solid rgba(231, 134, 167, 0.2);

        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #6B4C6E;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .input-group label .required {
            color: #E786A7;
        }
        .input-hint {
            font-size: 0.7rem;
            color: #B0A0B5;
            margin-top: 3px;
        }
        .input-box,
        .select-box {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 2px solid #E8D5E8;
            background: rgba(255,255,255,0.7);
            font-size: 1rem;
            color: #3D2C3F;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }
        .select-box {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23B983FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");

            background-size: 18px;

        .select-box:focus {
            border-color: #B983FF;
            box-shadow: 0 0 18px rgba(185, 131, 255, 0.25);
            background: rgba(255,255,255,0.95);
        }
        .input-box::placeholder {
            color: #C0A8C5;
        }
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;

            .input-row {

            }
            .header h1 {
                font-size: 1.6rem;
            }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #E786A7 0%, #B983FF 100%);
            color: #fff;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 28px rgba(185, 131, 255, 0.4);
            font-family: inherit;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 38px rgba(185, 131, 255, 0.55);
            background: linear-gradient(135deg, #F090B5, #C595FF);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(20%);
        }
        .stats {
            text-align: center;
            margin: 20px 0 10px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.7);
            border-radius: 30px;
            font-size: 0.85rem;
            color: #6B4C6E;

            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

        .stats strong {
            color: #B983FF;
        }
        .result {
            max-width: 950px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
            gap: 16px;
        }
        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }

        .item {
            background: rgba(255,255,255,0.9);

            border-radius: 16px;

            background: rgba(185, 131, 255, 0.15);
            color: #8B5CF6;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;

        .match-badge {

            padding: 3px 10px;
            border-radius: 12px;
            font-weight: 600;
            white-space: nowrap;
        }
        .prompt-content {
            font-size: 0.9rem;

            color: #3D2C3F;
            word-break: break-word;

            background: #C0B0C8;
            color: #5D4D60;
            pointer-events: none;
        }
        .empty-state {
            text-align: center;
            padding: 50px;

</head>

                    { keywords: ['国潮', '国货', '中国', '东方', '古典', '传统', '花西子', '完美日记'], style: '新锐国货' },
                    { keywords: ['纯净', '天然', '有机', '植物', '素颜', '无添加', 'clean'], style: '纯净自然' },

                    { keywords: ['法式', '巴黎', '优雅', '香氛', '香水', '浪漫', 'chic'], style: '法式优雅' },
                    { keywords: ['极简', '简约', '北欧', '冷淡', '性冷淡', 'muji'], style: '极简主义' },

                    { keywords: ['中性', '无性别', '男士', '男性', '护肤男'], style: '中性简约' },
                ];
                let detectedStyle = '轻奢网红';
                for (const mapping of styleMappings) {
                    for (const keyword of mapping.keywords) {
                        if (combinedText.includes(keyword)) {
                            detectedStyle = mapping.style;
                            break;
                        }
                    }
                    if (detectedStyle !== '轻奢网红') break;

                        primaryColors: ['粉色+白色+浅金', '蜜桃粉+奶油白', '樱花粉+淡紫'],
                        secondaryColors: ['粉紫+珍珠白', '珊瑚粉+鹅黄', '玫瑰粉+浅金'],
                        fonts: ['女性柔美手写风格', '优雅圆体发光字', '韩式细圆体'],
                        materials: ['亚克力发光字+粉色铝塑板', '玫瑰金不锈钢+白色底板', '渐变玻璃贴膜+发光字'],
                    },
                    '中性简约': {
                        primaryColors: ['深灰+白色+银色', '碳黑+冷白+原木', '灰蓝+米白'],
                        secondaryColors: ['藏青+浅灰', '水泥灰+白色', '石墨+米色'],
                        fonts: ['粗黑无衬线字体', '极简几何无衬线体', '高级无衬线定制字体'],
                        materials: ['深灰铝塑板+白色立体字', '超白玻璃+黑色金属', '石塑板+银色线条'],
                    },
                };
                const defaultConfig = {
                    primaryColors: ['粉色+玫瑰金+白色', '紫色渐变+银色点缀', '白金轻奢+裸粉色'],
                    secondaryColors: ['莫兰迪粉+哑光金', '薰衣草紫+珍珠白'],
                    fonts: ['优雅圆体发光字', '轻奢细体不锈钢字', '高级无衬线定制字体'],
                    materials: ['亚克力发光字+铝塑板背景', '玫瑰金不锈钢+UV高光板', '镜面不锈钢+大理石纹铝塑板'],
                };
                return configs[styleType] || defaultConfig;
            }

            // ============ 全局设计元素库 ============
            const GLOBAL_STYLES = [
                '轻奢网红风', '高端美妆空间', '女性打卡门头', '精致护肤品牌门头',
                '高级感商业门头', '极简医美风', '韩式清新美妆', '日系治愈护肤',
                '科技感成分党', '法式优雅香氛', '新锐国货美妆', '纯净美妆空间',
            ];

            const GLOBAL_MATERIALS = [
                '亚克力发光字+铝塑板背景',
                '不锈钢围边字+超白玻璃底板',
                '软膜灯箱结构+金属收边',
                '玫瑰金不锈钢+UV高光板',
                '镜面不锈钢+大理石纹铝塑板',
                '烤漆玻璃+黄铜色立体字',
                '哑光铝塑板+背发光亚克力',
                '白色石塑板+香槟金线条',
                '渐变玻璃贴膜+发光迷你字',
                '肤感铝塑板+玫瑰金腰线',
            ];

            const GLOBAL_TEXTURES = [
                '高级光泽感', '精致细腻触感', '轻奢通透视觉', '品牌质感强烈',
                '柔和珠光质感', '晶莹剔透视感', '丝绒哑光高级', '水光通透效果',
            ];

            const GLOBAL_FONTS = [
                '优雅圆体发光字', '轻奢细体不锈钢字', '高级无衬线定制字体',
                '女性柔美手写风格', '极简几何无衬线体', '韩式细圆体+英文衬线',
                '定制品牌专属字体', '纤细发光立体字',
            ];

            const GLOBAL_COLORS = [
                '粉色+玫瑰金+白色', '紫色渐变+银色点缀', '白金轻奢+裸粉色',
                '高级暖粉色+香槟金', '薰衣草紫+珍珠白', '蜜桃粉+浅金色',
                '樱花粉+灰白色', '莫兰迪粉+哑光金', '淡紫+银白+玫瑰金',
                '奶油粉+铜金色',
            ];

            const GLOBAL_LIGHTING = [
                '2700K暖光洗墙灯+门头发光字',
                '3500K柔和下照灯+橱窗重点射灯',
                '隐藏式灯带+亚克力字内发光',
                '暖白灯膜+背发光轮廓光',
                '3000K线性灯+模特补光灯(Ra≥90)',
                '柔光漫反射+品牌名侧发光',
            ];

            // 强化横向超宽结构描述
            const GLOBAL_STRUCTURES = [
                '横向超宽门头，品牌名水平居中，长条形发光标识，两侧通透玻璃',
                '超宽幅面门头，弱化柱子分割，连续灯箱延展，水平视觉延伸',
                '完全正立面展示，LOGO居中布局，落地玻璃门',
                '横向门头全覆盖，品牌名居中偏上，玻璃橱窗对称',
                '整铺门头立面，LOGO左侧+品类词右侧，落地玻璃',
                '全立面覆盖，发光字顶部排列，下方通透玻璃',
                '正立面一体化设计，品牌居中+正面发光标识，玻璃门',
            ];

            const GLOBAL_WINDOWS = [
                '落地玻璃橱窗+高清产品海报',
                '通透玻璃+局部UV印刷明星单品',
                '半透明贴膜+暖光内透展示',
                '整面玻璃+可更换灯箱海报',
                '玻璃贴膜+产品陈列透光展示',
            ];

            const GLOBAL_DISTRICTS = [
                '高端购物中心',
                '临街独立商铺',
                '步行街',
                '社区底商',
                '百货商场一层',
                '艺术园区',
                '交通枢纽（机场/高铁）',
                '地下商业街',
            ];

            // 新增横向超宽+16:9约束
            const CONSTRAINTS = '横向超宽大幅面门头，弱化竖向分割，强化水平延伸感，广角平视视角，展示完整门头宽度，整体开阔舒展大气，画面比例16:9 (ar 16:9)，严格要求完全正立面展示，正视视角，无透视';

            // ============ 工具函数 ============
            function shuffleArray(arr) {
                const shuffled = [...arr];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            function generateEnhancedCombinations(count, brandName, styleWord, userMaterial, userDistrict) {
                const analysis = analyzeStyle(brandName, styleWord);
                const mergedColors = [...new Set([...analysis.primaryColors, ...analysis.secondaryColors, ...GLOBAL_COLORS])];
                const mergedFonts = [...new Set([...analysis.fonts, ...GLOBAL_FONTS])];

                let finalMaterials;
                if (userMaterial && userMaterial !== '智能匹配') {
                    finalMaterials = [userMaterial];
                } else {
                    finalMaterials = [...new Set([...analysis.materials, ...GLOBAL_MATERIALS])];
                }

                let finalDistricts;
                if (userDistrict && userDistrict !== '不限') {
                    finalDistricts = [userDistrict];
                } else {
                    finalDistricts = shuffleArray(GLOBAL_DISTRICTS);
                }

                const shuffledStyles = shuffleArray([...new Set([analysis.detectedStyle + '风', ...GLOBAL_STYLES])]);
                const shuffledMaterials = shuffleArray(finalMaterials);
                const shuffledTextures = shuffleArray(GLOBAL_TEXTURES);
                const shuffledFonts = shuffleArray(mergedFonts);
                const shuffledColors = shuffleArray(mergedColors);
                const shuffledLighting = shuffleArray(GLOBAL_LIGHTING);
                const shuffledStructures = shuffleArray(GLOBAL_STRUCTURES);
                const shuffledWindows = shuffleArray(GLOBAL_WINDOWS);

                const combinations = [];
                for (let i = 0; i < count; i++) {
                    combinations.push({
                        style: shuffledStyles[i % shuffledStyles.length],
                        material: shuffledMaterials[i % shuffledMaterials.length],
                        texture: shuffledTextures[(i + 2) % shuffledTextures.length],
                        font: shuffledFonts[(i + 3) % shuffledFonts.length],
                        color: shuffledColors[(i + 4) % shuffledColors.length],
                        lighting: shuffledLighting[(i + 5) % shuffledLighting.length],
                        structure: shuffledStructures[(i + 6) % shuffledStructures.length],
                        window: shuffledWindows[(i + 7) % shuffledWindows.length],
                        district: finalDistricts[i % finalDistricts.length],
                        detectedStyle: analysis.detectedStyle,
                    });
                }
                return combinations;
            }

            function buildPromptWithTemplate(brand, styleWord, combo) {
                const brandName = brand;
                const userStyle = styleWord;

                const templates = [
                    (info) => {
                        let prompt = `${info.coreStyle}美妆护肤门头设计，品牌"${info.brand}"`;
                        if (info.userStyle) prompt += `·${info.userStyle}`;
                        prompt += `，${info.structure}，采用${info.material}，呈现${info.texture}效果，字体为${info.font}，整体色彩以${info.color}为主，灯光方案：${info.lighting}，橱窗：${info.window}`;
                        if (info.district) prompt += `，位于${info.district}商圈`;
                        prompt += `。${info.constraints}。`;
                        return prompt;
                    },
                    (info) => {
                        let prompt = `"${info.brand}"品牌`;
                        if (info.userStyle) prompt += `${info.userStyle}`;
                        prompt += `美妆店门头设计，主打${info.coreStyle}，${info.structure}，选用${info.material}，强调${info.color}视觉冲击，搭配${info.font}，整体呈现${info.texture}，${info.lighting}，${info.window}展示`;
                        if (info.district) prompt += `，${info.district}环境`;
                        prompt += `。${info.constraints}。`;
                        return prompt;
                    },
                    (info) => {
                        let prompt = `围绕"${info.brand}"`;
                        if (info.userStyle) prompt += `·${info.userStyle}`;
                        prompt += `打造美妆门头，风格定位${info.coreStyle}，${info.structure}，材质组合为${info.material}，突出${info.texture}与${info.color}，字体设计为${info.font}，${info.lighting}照明，${info.window}`;
                        if (info.district) prompt += `，适配${info.district}`;
                        prompt += `。${info.constraints}。`;
                        return prompt;
                    },
                    (info) => {
                        let prompt = `${info.coreStyle}风格门头，适用于"${info.brand}"`;
                        if (info.userStyle) prompt += `${info.userStyle}`;
                        prompt += `美妆护肤店，${info.structure}，通过${info.material}实现高级感，配合${info.color}体系与${info.font}设计，强化视觉识别，${info.lighting}，${info.window}`;
                        if (info.district) prompt += `，面向${info.district}客流`;
                        prompt += `。${info.constraints}。`;
                        return prompt;
                    },
                    (info) => {
                        let prompt = `商业街美妆门头，"${info.brand}"`;
                        if (info.userStyle) prompt += `${info.userStyle}`;
                        prompt += `，${info.coreStyle}调性，${info.structure}，${info.material}+${info.font}，色彩${info.color}，质感${info.texture}，${info.lighting}，搭配${info.window}`;
                        if (info.district) prompt += `，商圈属性：${info.district}`;
                        prompt += `。${info.constraints}。`;
                        return prompt;
                    },
                    (info) => {
                        let prompt = `高颜值打卡美妆门头，"${info.brand}"`;
                        if (info.userStyle) prompt += `${info.userStyle}`;
                        prompt += `，定位${info.coreStyle}，${info.structure}，使用${info.material}打造${info.texture}，${info.color}配色+${info.font}，${info.lighting}营造氛围，${info.window}`;
                        if (info.district) prompt += `，契合${info.district}调性`;
                        prompt += `。${info.constraints}。`;
                        return prompt;
                    },
                ];

                const templateIndex = Math.floor(Math.random() * templates.length);
                return templates[templateIndex]({
                    brand: brandName,
                    userStyle: userStyle,
                    coreStyle: combo.style,
                    material: combo.material,
                    texture: combo.texture,
                    font: combo.font,
                    color: combo.color,
                    lighting: combo.lighting,
                    structure: combo.structure,
                    window: combo.window,
                    district: combo.district,
                    constraints: CONSTRAINTS,
                });
            }

            function validateUniqueness(prompts) {
                const seen = new Set();
                for (const prompt of prompts) {
                    if (seen.has(prompt)) return false;
                    seen.add(prompt);
                }
                return true;
            }

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, (m) => map[m]);
            }

            function escapeAttr(text) {
                return text.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            // ============ 主生成函数 ============
            function generatePrompts() {
                const brandInput = document.getElementById('brandInput');
                const styleInput = document.getElementById('styleInput');
                const materialSelect = document.getElementById('materialSelect');
                const districtSelect = document.getElementById('districtSelect');
                const resultsGrid = document.getElementById('resultsGrid');
                const statsBar = document.getElementById('statsBar');
                const generateBtn = document.getElementById('generateBtn');

                const brandName = brandInput.value.trim();
                const styleWord = styleInput.value.trim();
                const userMaterial = materialSelect.value;
                const userDistrict = districtSelect.value;

                if (!brandName) {
                    alert('⚠️ 请输入品牌名称');
                    brandInput.focus();
                    return;
                }

                generateBtn.disabled = true;
                generateBtn.textContent = '⏳ 生成中...';
                resultsGrid.innerHTML = '<div class="empty-state">⏳ 正在智能分析并生成20组不重复提示词...</div>';
                statsBar.innerHTML = '';

                setTimeout(() => {
                    try {
                        const analysis = analyzeStyle(brandName, styleWord);
                        const combinations = generateEnhancedCombinations(20, brandName, styleWord, userMaterial, userDistrict);

                        const prompts = combinations.map((combo) =>
                            buildPromptWithTemplate(brandName, styleWord, combo)
                        );

                        const isUnique = validateUniqueness(prompts);

                        console.log('========== 智能分析报告 ==========');
                        console.log(`🔍 检测风格：${analysis.detectedStyle}`);
                        console.log(`🎨 匹配主色系：${analysis.primaryColors.join(' / ')}`);
                        console.log(`✍️ 匹配字体：${analysis.fonts.join(' / ')}`);
                        console.log(`🧱 使用材质：${userMaterial === '智能匹配' ? '智能匹配' : userMaterial}`);
                        console.log(`📍 商圈环境：${userDistrict === '不限' ? '随机' : userDistrict}`);
                        console.log(`🖼️ 横向超宽门头 + 16:9 已启用`);
                        console.log(`✅ 生成数量：${prompts.length}组`);
                        console.log(`✅ 去重验证：${isUnique ? '完全去重 ✓' : '存在重复 ✗'}`);
                        console.log('===================================');

                        let finalPrompts = prompts;
                        if (!isUnique) {
                            const seen = new Set();
                            finalPrompts = [];
                            for (const prompt of prompts) {
                                if (!seen.has(prompt)) {
                                    seen.add(prompt);
                                    finalPrompts.push(prompt);
                                }
                            }
                            let attempts = 0;
                            while (finalPrompts.length < 20 && attempts < 200) {
                                const newCombo = generateEnhancedCombinations(1, brandName, styleWord, userMaterial, userDistrict)[0];
                                const newPrompt = buildPromptWithTemplate(brandName, styleWord, newCombo);
                                if (!seen.has(newPrompt)) {
                                    seen.add(newPrompt);
                                    finalPrompts.push(newPrompt);
                                }
                                attempts++;
                            }
                        }

                        resultsGrid.innerHTML = '';
                        finalPrompts.forEach((promptText, index) => {
                            const itemDiv = document.createElement('div');
                            itemDiv.className = 'item';

                            itemDiv.innerHTML = `
                                <div class="item-header">
                                    <div class="item-number">${index + 1}</div>
                                    <span class="unique-badge">✓ 唯一组合</span>
                                    <span class="match-badge">🎨 ${analysis.detectedStyle}匹配</span>
                                </div>
                                <div class="prompt-content">${escapeHtml(promptText)}</div>
                                <button class="copy-btn" data-prompt="${escapeAttr(promptText)}">📋 复制提示词</button>
                            `;

                            const copyBtn = itemDiv.querySelector('.copy-btn');
                            copyBtn.addEventListener('click', function() {
                                const textToCopy = this.getAttribute('data-prompt');
                                if (navigator.clipboard && navigator.clipboard.writeText) {
                                    navigator.clipboard.writeText(textToCopy).then(() => {
                                        this.textContent = '✅ 已复制';
                                        this.classList.add('copied');
                                        setTimeout(() => {
                                            this.textContent = '📋 复制提示词';
                                            this.classList.remove('copied');
                                        }, 2000);
                                    }).catch(() => fallbackCopy(this, textToCopy));
                                } else {
                                    fallbackCopy(this, textToCopy);
                                }
                            });

                            resultsGrid.appendChild(itemDiv);
                        });

                        statsBar.innerHTML = `
                            ✅ 成功生成 <strong>${finalPrompts.length}</strong> 组提示词 |
                            🖼️ <strong>横向超宽门头 · 16:9</strong> |
                            🎨 风格：<strong>${analysis.detectedStyle}</strong> |
                            🧱 材质：<strong>${userMaterial === '智能匹配' ? '智能匹配' : userMaterial}</strong> |
                            📍 商圈：<strong>${userDistrict === '不限' ? '随机' : userDistrict}</strong>
                        `;
                    } catch (error) {
                        console.error('生成提示词出错：', error);
                        resultsGrid.innerHTML = '<div class="empty-state">❌ 生成失败，请刷新页面重试</div>';
                        statsBar.innerHTML = '⚠️ 发生错误，请查看控制台';
                    } finally {
                        generateBtn.disabled = false;
                        generateBtn.textContent = '⚡ 生成20组不重复提示词';
                    }
                }, 100);
            }

            function fallbackCopy(buttonEl, text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try { document.execCommand('copy'); } catch (e) {}
                document.body.removeChild(textarea);
                buttonEl.textContent = '✅ 已复制';
                buttonEl.classList.add('copied');
                setTimeout(() => {
                    buttonEl.textContent = '📋 复制提示词';
                    buttonEl.classList.remove('copied');
                }, 2000);
            }

            document.getElementById('generateBtn').addEventListener('click', generatePrompts);
            window.addEventListener('DOMContentLoaded', () => {
                generatePrompts();
            });
            window.generatePrompts = generatePrompts;
        })();
    </script>
